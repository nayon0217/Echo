[pytest]
testpaths = tests
python_files = test_*.py

# Live tests call the real Claude API and load the real Whisper weights: they cost
# money and take time, so they are opt-in via --live (see tests/conftest.py).
markers =
    live: hits the real Claude API and/or real Whisper. Run with --live.

filterwarnings =
    ignore::DeprecationWarning
