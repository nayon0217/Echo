# ECHO fact-check corpus — curated source list (policy.md §3, §13).
#
# Manual curation beats scraping at this corpus size. Each entry is one document;
# ingest/fetch.py fetches it with trafilatura, chunks it heading-aware, and
# upserts it into Postgres. `title` is auto-derived from page metadata when
# omitted. `source_url` is the natural key — editing this list and re-running
# fetch.py upserts rather than duplicating.
#
# authority_tier (policy.md §3):
#   1 = MOM / SPF ScamAlert / CPF / IRAS   (canonical)
#   2 = TWC2 / Migrant Workers' Centre     (fills gaps MOM doesn't cover)
#   3 = ST / CNA reporting                 (dating changes only, never sole support)
#
# Scope note: this build is the policy fact-checking path (policy.md scope line).
# SPF ScamAlert (also tier 1) remains deferred — scamalert.sg robots.txt / AI-usage
# signals mean we should not scrape it until the scam handler is built with an
# explicit rights-cleared corpus.
#
# Tier 2–3 pages are curated (not mass-crawled). Tier 3 is for dating policy
# changes only; verify.py gate 4 refuses supported/refuted verdicts that rest
# solely on tier-3 citations.

